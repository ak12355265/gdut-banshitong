/* 工大办事通 · 样式
 * 设计原则：信息优先、高对比度、可打印、移动端可用

:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --ink: #15181d;
  --ink-2: #59616e;
  --ink-3: #868e9c;
  --line: #e2e5eb;
  --line-2: #f0f2f5;
  --brand: #17457a;
  --brand-2: #0e3059;
  --brand-soft: #eaf0f8;
  --accent: #c8791a;
  --accent-soft: #fdf3e3;
  --ok: #1b6e4a;
  --ok-soft: #e8f4ee;
  --warn: #a8481b;
  --warn-soft: #fbeee7;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(21, 24, 29, .06), 0 8px 24px rgba(21, 24, 29, .05);
  --maxw: 880px;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.7 "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
}

a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }

.skip {
  position: absolute; left: -9999px; top: 0;
  background: var(--brand); color: #fff; padding: 10px 16px; border-radius: 0 0 var(--radius-sm) 0;
  z-index: 10;
}
.skip:focus { left: 0; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

/* ---------- 顶栏 ---------- */
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.topbar-in {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; min-height: 64px;
}
.brand { display: flex; align-items: center; gap: 10px; color: inherit; }
.brand:hover { text-decoration: none; }
.brand-mark {
  width: 36px; height: 36px; flex: none;
  display: grid; place-items: center;
  background: var(--brand); color: #fff;
  border-radius: 10px; font-weight: 700; font-size: 18px;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text strong { font-size: 16px; }
.brand-text small { color: var(--ink-3); font-size: 12px; }
.topnav { display: flex; gap: 18px; font-size: 14px; }
.topnav a { color: var(--ink-2); }
.topnav a:hover { color: var(--brand); }

/* ---------- 通用 ---------- */
main { padding: 28px 20px 56px; }
h1 { font-size: 26px; line-height: 1.35; margin: 0 0 8px; }
h2 { font-size: 18px; margin: 32px 0 12px; }
h3 { font-size: 16px; margin: 0 0 6px; }
p { margin: 0 0 12px; }
.muted { color: var(--ink-3); font-size: 13px; }
.lead { color: var(--ink-2); font-size: 17px; }

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.pad { padding: 20px 22px; }

.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; line-height: 1.7; white-space: nowrap;
}
.badge-draft { background: var(--accent-soft); color: var(--accent); }
.badge-verified { background: var(--ok-soft); color: var(--ok); }
.badge-demo { background: var(--brand-soft); color: var(--brand); }
.badge-plain { background: var(--line-2); color: var(--ink-2); }

/* ---------- 首页头部 ---------- */
.hero { margin-bottom: 22px; }
.hero h1 { letter-spacing: -.2px; }
.stats { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 16px; }
.stat { display: flex; flex-direction: column; }
.stat b { font-size: 22px; color: var(--brand); line-height: 1.2; }
.stat span { font-size: 12px; color: var(--ink-3); }

/* 徽章图例：用户测试发现橙色标签不容易懂，这里直接补一句解释 */
.legend {
  margin-top: 18px; padding: 12px 16px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); font-size: 13px; color: var(--ink-2);
  line-height: 2.1;
}
.legend .badge { margin-right: 4px; }

/* ---------- 搜索 ---------- */
.search { margin: 22px 0 8px; position: relative; }
.search input {
  width: 100%; padding: 15px 52px 15px 18px;
  font-size: 16px; font-family: inherit; color: var(--ink);
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: var(--radius); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.search .go {
  position: absolute; right: 8px; top: 8px; bottom: 8px; width: 40px;
  display: grid; place-items: center;
  background: var(--brand); color: #fff;
  border: 0; border-radius: var(--radius-sm); cursor: pointer; font-size: 16px;
}
.hint { font-size: 13px; color: var(--ink-3); margin: 8px 2px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  padding: 5px 12px; font-size: 13px; font-family: inherit;
  background: var(--card); color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
}
.chip:hover { border-color: var(--brand); color: var(--brand); }

/* ---------- 流程卡片 ---------- */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.flow-card {
  display: block; color: inherit; padding: 16px 18px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  transition: transform .12s, border-color .12s;
}
.flow-card:hover { text-decoration: none; transform: translateY(-2px); border-color: var(--brand); }
.flow-card h3 { margin: 0 0 6px; font-size: 16px; }
.flow-card p { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.flow-card .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.result { padding: 14px 18px; }
.result h3 { margin: 0 0 4px; font-size: 16px; }
.why { font-size: 12.5px; color: var(--accent); margin: 0; }
.score { font-size: 12px; color: var(--ink-3); }

/* ---------- 详情页 ---------- */
.back { display: inline-block; font-size: 14px; margin-bottom: 14px; color: var(--ink-2); }
.detail-head { margin-bottom: 18px; }
.detail-head .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: 88px 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }

.steps { list-style: none; margin: 0; padding: 0; }
.step {
  position: relative; padding: 0 0 22px 46px;
  border-left: 2px solid var(--line); margin-left: 15px;
}
.step:last-child { border-left-color: transparent; padding-bottom: 0; }
.step::before {
  content: attr(data-n);
  position: absolute; left: -16px; top: 0;
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--brand); color: #fff; font-size: 14px; font-weight: 600;
}
.step-body { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.step-body h3 { margin-bottom: 4px; }
.step-body > p { font-size: 14px; color: var(--ink-2); }

.facts { display: grid; gap: 6px; margin: 12px 0 0; font-size: 13.5px; }
.fact { display: flex; gap: 8px; }
.fact b { flex: none; width: 68px; color: var(--ink-3); font-weight: 400; }

.mats { list-style: none; margin: 12px 0 0; padding: 10px 12px; background: var(--line-2); border-radius: var(--radius-sm); }
.mats li { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding: 3px 0; }
.mats input { margin-top: 5px; flex: none; }
.mats label { cursor: pointer; }
.mats input:checked + label { color: var(--ink-3); text-decoration: line-through; }

.pitfall { margin-top: 12px; padding: 10px 12px; background: var(--warn-soft); border-radius: var(--radius-sm); font-size: 13.5px; color: var(--warn); }
.pitfall b { display: block; margin-bottom: 2px; }

.empty { padding: 22px; text-align: center; background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty h3 { margin-bottom: 6px; }
.needlist { list-style: none; margin: 14px 0 0; padding: 0; text-align: left; display: grid; gap: 6px; }
.needlist li { font-size: 13.5px; color: var(--ink-2); padding-left: 20px; position: relative; }
.needlist li::before { content: "○"; position: absolute; left: 0; color: var(--ink-3); }

.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0 0; }
.btn {
  padding: 10px 18px; font-size: 14px; font-family: inherit; cursor: pointer;
  background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: var(--radius-sm);
}
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn-primary:hover { background: var(--brand-2); color: #fff; border-color: var(--brand-2); }

.notice { margin-top: 22px; padding: 14px 16px; background: var(--brand-soft); border-radius: var(--radius); font-size: 13px; color: var(--brand-2); }
.notice b { display: block; margin-bottom: 4px; }

.sources { list-style: none; margin: 10px 0 0; padding: 0; font-size: 13.5px; }
.sources li { padding: 6px 0; border-bottom: 1px solid var(--line-2); }
.sources li:last-child { border-bottom: 0; }

/* ---------- 补充信息卡片 ---------- */
.note-card {
  background: var(--card); border: 1px solid var(--line);
  border-left: 3px solid var(--brand);
  border-radius: var(--radius); padding: 16px 20px; margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.note-card h3 { margin-bottom: 10px; font-size: 15px; }
.notelist { list-style: none; margin: 0; padding: 0; font-size: 13.5px; color: var(--ink-2); }
.notelist li { padding: 4px 0 4px 16px; position: relative; }
.notelist li::before {
  content: ""; position: absolute; left: 2px; top: 12px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--brand);
}

/* ---------- 关于页 ---------- */
.prose { font-size: 15px; }
.prose h2 { border-top: 1px solid var(--line); padding-top: 22px; }
.prose ul { padding-left: 22px; }
.prose li { margin-bottom: 6px; }
.prose code { background: var(--line-2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.prose .tpl {
  background: var(--line-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 16px; margin: 10px 0 16px; font-size: 13.5px; line-height: 1.9;
  white-space: pre-wrap; font-family: inherit; color: var(--ink-2);
}

/* ---------- 页脚 ---------- */
.footer { border-top: 1px solid var(--line); background: var(--card); padding: 20px 0 32px; }
.footer p { margin: 0; }

/* ---------- 小屏 ---------- */
@media (max-width: 560px) {
  main { padding: 20px 16px 44px; }
  .wrap { padding: 0 16px; }
  h1 { font-size: 22px; }
  .brand-text small { display: none; }
  .kv { grid-template-columns: 76px 1fr; }
  .step { padding-left: 40px; }
}

/* ---------- 打印（分享给同学时可直接打印） ---------- */
@media print {
  .topbar, .footer, .actions, .search, .back, .skip { display: none !important; }
  body { background: #fff; font-size: 12pt; }
  .card, .step-body { box-shadow: none; border-color: #ccc; }
  .step { break-inside: avoid; }
}

/* 说明：这里曾有一条「演示样例：校园卡补办」，用于在真实内容录入前展示界面效果。
 * 9 条真实流程录入完成后已删除——一个虚构的办事流程留在成品里是纯粹的负债。 */
</script>
<script>
/* 工大办事通 · 应用逻辑
 * 零依赖、无后端、无网络请求。
 * 结构：路由 → 页面渲染 → 检索算法 → 分享导出
 */
(function () {
  'use strict';

  var SITE = window.SITE || {};
  var FLOWS = (window.FLOWS || []).slice();
  var CATS = window.FLOW_CATEGORIES || [];
  var NEED_FIELDS = window.NEED_FIELDS || [];

  var main = document.getElementById('main');
  var state = { q: '' };

  /* ---------------- 工具 ---------------- */

  function $(sel, root) { return (root || document).querySelector(sel); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var store = {
    get: function (k, d) {
      try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set: function (k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 隐私模式忽略 */ }
    }
  };

  function byId(id) {
    for (var i = 0; i < FLOWS.length; i++) if (FLOWS[i].id === id) return FLOWS[i];
    return null;
  }

  function catName(id) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i].name;
    return id === 'demo' ? '演示样例' : '其他';
  }

  function statusBadge(flow) {
    if (flow.status === 'verified') return '<span class="badge badge-verified">已核实</span>';
    if (flow.status === 'demo') return '<span class="badge badge-demo">演示样例 · 非真实流程</span>';
    // 内容已录入但来源还没登记完：如实区分，不要和"完全没内容"混成一句
    if (stepCount(flow)) return '<span class="badge badge-draft">还没核实完 · 仅供参考</span>';
    return '<span class="badge badge-draft">内容核实中</span>';
  }

  function stepCount(flow) { return (flow.steps || []).length; }

  function cardMeta(flow) {
    return '<span class="badge badge-plain">' + catName(flow.category) + '</span>' +
      (stepCount(flow) ? '<span class="badge badge-plain">' + stepCount(flow) + ' 步</span>' : '') +
      statusBadge(flow);
  }

  /* ---------------- 检索算法 ----------------
   * 全中文、可解释、不依赖任何分词库。
   * 步骤：归一化 → 逐字段加权命中 → 二元组（bigram）相似度兜底 → 排序
   */

  function normalize(s) {
    return String(s == null ? '' : s)
      .toLowerCase()
      // 全角转半角
      .replace(/[\uFF01-\uFF5E]/g, function (c) {
        return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
      })
      .replace(/[\s\u3000]+/g, '')
      .replace(/[，。、；：？！""''（）《》【】·,.;:?!"'()\[\]<>_\-\/\\|~`@#$%^&*+=]/g, '');
  }

  function bigrams(s) {
    var set = {};
    if (s.length === 1) { set[s] = 1; return set; }
    for (var i = 0; i < s.length - 1; i++) set[s.slice(i, i + 2)] = 1;
    return set;
  }

  function flowHaystack(flow) {
    var parts = [flow.name];
    parts = parts.concat(flow.aliases || [], flow.keywords || [], [flow.summary || '']);
    (flow.steps || []).forEach(function (st) {
      parts.push(st.title || '', st.detail || '', st.place || '');
      (st.materials || []).forEach(function (m) { parts.push(m); });
    });
    return normalize(parts.join('|'));
  }

  function scoreFlow(flow, rawQuery) {
    var q = normalize(rawQuery);
    if (!q) return null;

    var score = 0;
    var why = [];
    var name = normalize(flow.name);

    if (name === q) { score += 100; why.push('流程名完全一致'); }
    else if (name.indexOf(q) >= 0) { score += 55; why.push('流程名包含「' + rawQuery + '」'); }
    else if (q.indexOf(name) >= 0 && name.length >= 3) { score += 35; why.push('流程名被你的描述包含'); }

    (flow.aliases || []).forEach(function (a) {
      var na = normalize(a);
      if (na === q) { score += 50; why.push('口语说法「' + a + '」'); }
      else if (na.indexOf(q) >= 0 || (q.length >= 2 && q.indexOf(na) >= 0)) { score += 28; why.push('口语说法「' + a + '」'); }
    });

    (flow.keywords || []).forEach(function (k) {
      var nk = normalize(k);
      if (nk.indexOf(q) >= 0 || (q.length >= 2 && q.indexOf(nk) >= 0)) { score += 16; why.push('关键词「' + k + '」'); }
    });

    (flow.steps || []).forEach(function (st) {
      var t = normalize((st.title || '') + (st.detail || ''));
      if (t.indexOf(q) >= 0) { score += 7; why.push('出现在步骤「' + (st.title || '') + '」'); }
    });

    // 二元组相似度兜底：处理错字、语序不同、多余修饰
    var qb = bigrams(q);
    var hb = bigrams(flowHaystack(flow));
    var hit = 0, total = 0;
    for (var g in qb) { if (!Object.prototype.hasOwnProperty.call(qb, g)) continue; total++; if (hb[g]) hit++; }
    var ratio = total ? hit / total : 0;
    // 长口语整句（如"书丢了要赔多少钱"）里混着大量与知识库无关的字，
    // 二元组重合率会被稀释。原来要求 ratio > 0.34 才给分，
    // 导致长句直接返回"没有找到"。改为阈值 0.15、重合多少给多少分。
    if (ratio >= 0.15) { score += Math.round(ratio * 26); why.push('文字相近（匹配度 ' + Math.round(ratio * 100) + '%）'); }

    if (score <= 0) return null;

    var uniq = [];
    why.forEach(function (w) { if (uniq.indexOf(w) < 0) uniq.push(w); });
    return { flow: flow, score: score, why: uniq.slice(0, 3) };
  }

  function search(rawQuery) {
    return FLOWS
      .map(function (f) { return scoreFlow(f, rawQuery); })
      .filter(Boolean)
      .sort(function (a, b) { return b.score - a.score; })
      .slice(0, 5);
  }

  /* ---------------- 首页 ---------------- */

  function heroHTML() {
    var verified = FLOWS.filter(function (f) { return f.status === 'verified'; }).length;
    return '' +
      '<section class="hero">' +
      '<h1>办事之前，先看一眼这条路怎么走</h1>' +

      '要带什么材料、去哪办、多久办完、为什么会被退回。</p>' +
      '<div class="stats">' +
      '<div class="stat"><b>' + FLOWS.length + '</b><span>条办事流程</span></div>' +
      '<div class="stat"><b>' + verified + '</b><span>条已完成核实</span></div>' +
      '<div class="stat"><b>0</b><span>个账号 / 不收集个人信息</span></div>' +
      '</div>' +
      // 徽章图例：测试发现用户看不懂橙色标签，这里直接给出一句话解释
      '<p class="legend">' +
      '<span class="badge badge-verified">已核实</span> 有官方来源，可以放心参考　' +
      '<span class="badge badge-draft">还没核实完 · 仅供参考</span> 内容已整理，来源还在核实，重要的事请再问一次' +
      '</p>' +
      '</section>';
  }

  function searchHTML() {
    var chips = ['报修', '转专业', '成绩单', '借教室', '缓考', '奖学金', '盖章', '图书馆'];
    return '' +
      '<section class="search">' +
      '<input id="q" type="search" autocomplete="off" placeholder="你要办什么事？例如：学生证丢了 / 想转专业 / 打印成绩单" ' +
      'value="' + esc(state.q) + '" aria-label="搜索办事流程">' +
      '<button class="go" id="go" type="button" aria-label="搜索">→</button>' +
      '</section>' +
      '<p class="hint">支持口语说法，例如「卡丢了」「怎么借教室」。</p>' +
      '<div class="chips">' + chips.map(function (c) {
        return '<button class="chip" type="button" data-q="' + esc(c) + '">' + esc(c) + '</button>';
      }).join('') + '</div>';
  }

  function recentHTML() {
    var ids = store.get('bt.recent', []);
    var items = ids.map(byId).filter(Boolean);
    if (!items.length) return '';
    return '<h2>刚才看过</h2><div class="grid">' + items.map(flowCardHTML).join('') + '</div>';
  }

  function flowCardHTML(flow) {
    var desc = flow.summary || '这条流程的办理条件、材料、地点和时限正在核实中。';
    return '<a class="flow-card" href="#/f/' + esc(flow.id) + '">' +

      '<p>' + esc(desc) + '</p>' +

  function categoryHTML() {
    var out = '';
    CATS.forEach(function (cat) {
      var list = FLOWS.filter(function (f) { return f.category === cat.id; });
      if (!list.length) return;
      out += '<h2>' + esc(cat.name) + '</h2><div class="grid">' + list.map(flowCardHTML).join('') + '</div>';
    });

  }

  function resultsHTML(q) {
    var res = search(q);
    if (!res.length) {
      return '<div class="empty">' +
        '<h3>没有找到「' + esc(q) + '」</h3>' +
        '<p class="muted">换一种说法试试，比如只说动词和对象：转专业、成绩单、借教室。</p>' +
        '<p class="muted">也可能是这条流程还没有被收录。目前收录范围：' + esc(SITE.scope || '') + '。</p>' +
        '</div>';
    }
    return '<h2>找到 ' + res.length + ' 条相关流程</h2><div class="grid">' +
      res.map(function (r) {
        return '<a class="flow-card result" href="#/f/' + esc(r.flow.id) + '">' +
          '<h3>' + esc(r.flow.name) + '</h3>' +
          '<p class="why">因为：' + esc(r.why.join(' · ')) + '</p>' +
          '<div class="meta">' + cardMeta(r.flow) + '</div>' +
          '</a>';
      }).join('') + '</div>';
  }

  function panelHTML() {
    if (state.q.trim()) return resultsHTML(state.q.trim());
    return recentHTML() + categoryHTML();
  }

  function renderHome() {
    main.innerHTML = heroHTML() + searchHTML() + '<div id="panel">' + panelHTML() + '</div>';
    var input = $('#q');
    var panel = $('#panel');

    function refresh() {
      state.q = input.value;
      panel.innerHTML = panelHTML();
    }

    input.addEventListener('input', refresh);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') refresh(); });
    $('#go').addEventListener('click', refresh);
    document.querySelectorAll('.chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        input.value = btn.getAttribute('data-q');
        refresh();
        input.focus();
      });
    });
  }

  /* ---------------- 详情页 ---------------- */

  function stepHTML(step, i, flowId) {
    var mats = '';
    if (step.materials && step.materials.length) {
      mats = '<ul class="mats">' + step.materials.map(function (m, mi) {
        var key = 'bt.mat.' + flowId + '.' + i + '.' + mi;
        var checked = store.get(key, false) ? ' checked' : '';
        var id = 'm' + i + '_' + mi;
        return '<li><input type="checkbox" id="' + id + '" data-mat="' + esc(key) + '"' + checked + '>' +
          '<label for="' + id + '">' + esc(m) + '</label></li>';
      }).join('') + '</ul>';
    }

    var facts = '';
    if (step.place || step.duration) {
      facts = '<div class="facts">' +
        (step.place ? '<div class="fact"><b>办理地点</b><span>' + esc(step.place) + '</span></div>' : '') +
        (step.duration ? '<div class="fact"><b>所需时间</b><span>' + esc(step.duration) + '</span></div>' : '') +
        '</div>';
    }

    var pit = '';
    if (step.pitfalls && step.pitfalls.length) {
      pit = '<div class="pitfall"><b>容易被退回的地方</b>' +
        step.pitfalls.map(esc).join('<br>') + '</div>';
    }

    return '<li class="step" data-n="' + (i + 1) + '">' +
      '<div class="step-body">' +
      '<h3>' + esc(step.title) + '</h3>' +
      (step.detail ? '<p>' + esc(step.detail) + '</p>' : '') +
      facts + mats + pit +
      '</div></li>';
  }

  function draftPanelHTML() {
    return '<div class="empty">' +
      '<h3>这条流程正在核实中</h3>' +
      '<p class="muted">我们只写有来源的步骤。在向学校官方渠道确认之前，这里不会给出具体信息，避免你按错的信息白跑一趟。</p>' +
      '<ul class="needlist">' + NEED_FIELDS.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>' +
      '</div>';
  }

  function notesHTML(flow) {
    if (!flow.notes || !flow.notes.length) return '';
    return '<h2>补充信息</h2>' + flow.notes.map(function (n) {
      return '<div class="note-card">' +
        '<h3>' + esc(n.title || '') + '</h3>' +
        '<ul class="notelist">' +
        (n.lines || []).map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') +
        '</ul></div>';
    }).join('');
  }

  function sourcesHTML(flow) {
    if (!flow.sources || !flow.sources.length) {
      var msg = (stepCount(flow) && window.NEEDS_SOURCE)
        ? window.NEEDS_SOURCE
        : '尚未登记来源。核实完成后，每一条流程都会附上信息来源与核实时间。';
      return '<p class="muted">' + esc(msg) + '</p>';
    }
    return '<ul class="sources">' + flow.sources.map(function (s) {
      var label = esc(s.label || '来源');
      var text = s.url ? '<a href="' + esc(s.url) + '" rel="noopener">' + label + '</a>' : label;
      return '<li>' + text + (s.note ? '<br><span class="muted">' + esc(s.note) + '</span>' : '') + '</li>';
    }).join('') + '</ul>';
  }

  function renderFlow(id) {
    var flow = byId(id);
    if (!flow) {
      main.innerHTML = '<a class="back" href="#/">← 返回流程列表</a>' +

    // 记录"刚才看过"
    var recent = store.get('bt.recent', []).filter(function (x) { return x !== flow.id; });
    recent.unshift(flow.id);

    var stepsHTML = stepCount(flow)
      ? '<ol class="steps">' + flow.steps.map(function (s, i) { return stepHTML(s, i, flow.id); }).join('') + '</ol>'
      : draftPanelHTML();

    var verifyLine = flow.status === 'verified'
      ? '核实人：' + esc(flow.verifiedBy || '—') + '　核实时间：' + esc(flow.verifiedAt || '—')
      : (flow.status === 'demo' ? '演示样例，无真实核实信息' : '尚未核实');

    main.innerHTML = '' +
      '<a class="back" href="#/">← 返回流程列表</a>' +
      '<div class="detail-head">' +
      '<div class="row">' + statusBadge(flow) +

      (stepCount(flow) ? '<span class="badge badge-plain">' + stepCount(flow) + ' 步</span>' : '') +
      '</div>' +
      '<h1>' + esc(flow.name) + '</h1>' +
      (flow.summary ? '<p class="lead">' + esc(flow.summary) + '</p>' : '') +
      '<dl class="kv">' +
      '<dt>适用对象</dt><dd>' + esc(flow.audience || '待核实') + '</dd>' +

      '</dl>' +
      '</div>' +
      stepsHTML +
      notesHTML(flow) +

      '，请以学校官网、学院通知或办事窗口的答复为准。</div>' +
      '<h2>信息来源</h2>' + sourcesHTML(flow);

    document.querySelectorAll('.mats input').forEach(function (box) {
      box.addEventListener('change', function () {
        store.set(box.getAttribute('data-mat'), box.checked);
      });

    document.getElementById('dl').addEventListener('click', function () { downloadImage(flow); });
    document.getElementById('copy').addEventListener('click', function (e) { copyText(flow, e.target); });

  }

  /* ---------------- 分享：长图 ---------------- */

  var FONT = '"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif';

  function setFont(ctx, size, weight) { ctx.font = (weight || 400) + ' ' + size + 'px ' + FONT; }

  function wrapText(ctx, text, maxWidth) {
    var lines = [];
    var line = '';
    var chars = String(text == null ? '' : text).split('');
    for (var i = 0; i < chars.length; i++) {
      var ch = chars[i];
      if (ch === '\n') { lines.push(line); line = ''; continue; }
      var test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = ch; }
      else { line = test; }
    }
    lines.push(line);
    return lines;
  }

  /* 同一套布局逻辑跑两遍：先量高度，再真正绘制 */
  function layoutCard(ctx, flow, paint) {
    var W = 900, PAD = 56, x = PAD, maxW = W - PAD * 2;
    var y = 0;

    // 顶部色块
    var headH = 168;
    if (paint) {
      var g = ctx.createLinearGradient(0, 0, W, headH);
      g.addColorStop(0, '#17457a');
      g.addColorStop(1, '#0e3059');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, headH);
      ctx.fillStyle = 'rgba(255,255,255,.72)';
      setFont(ctx, 20, 400);
      ctx.fillText((SITE.school || '') + ' ' + (SITE.campus || ''), x, 52);
      ctx.fillStyle = '#ffffff';
      setFont(ctx, 38, 700);
      var titleLines = wrapText(ctx, flow.name, maxW);
      var ty = 104;
      titleLines.slice(0, 2).forEach(function (ln) { ctx.fillText(ln, x, ty); ty += 46; });
    }
    y = headH;

    if (paint) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, 4000); }
    y += 52;

    // 状态行
    var statusText = flow.status === 'verified' ? '已核实 · ' + (flow.verifiedAt || '')
      : flow.status === 'demo' ? '演示样例 · 非真实流程'
        : '内容核实中 · 请以学校通知为准';
    if (paint) {
      setFont(ctx, 20, 400);
      ctx.fillStyle = flow.status === 'verified' ? '#1b6e4a' : '#c8791a';
      ctx.fillText(statusText, x, y);
    }
    y += 40;

    // 适用对象
    if (flow.audience) {
      setFont(ctx, 22, 400);
      if (paint) {
        ctx.fillStyle = '#59616e';
        wrapText(ctx, '适用对象：' + flow.audience, maxW).forEach(function (ln) {
          ctx.fillText(ln, x, y); y += 32;
        });
      } else {
        y += wrapText(ctx, '适用对象：' + flow.audience, maxW).length * 32;
      }
      y += 14;
    }

    // 步骤
    var steps = flow.steps || [];
    if (!steps.length) {
      setFont(ctx, 24, 400);
      var emptyLines = wrapText(ctx, '这条流程的办理条件、所需材料、办理地点与时间正在核实中。核实完成前不给出具体信息。', maxW - 10);
      if (paint) {
        ctx.fillStyle = '#59616e';
        emptyLines.forEach(function (ln) { ctx.fillText(ln, x, y); y += 36; });
      } else { y += emptyLines.length * 36; }
      y += 20;
    }

    steps.forEach(function (st, i) {
      var top = y;
      // 序号圆点
      if (paint) {
        ctx.beginPath();
        ctx.arc(x + 17, top + 12, 17, 0, Math.PI * 2);
        ctx.fillStyle = '#17457a';
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        setFont(ctx, 20, 700);
        ctx.textAlign = 'center';
        ctx.fillText(String(i + 1), x + 17, top + 19);
        ctx.textAlign = 'left';
      }

      var tx = x + 50;
      var tw = W - PAD - tx;
      setFont(ctx, 26, 700);
      var tl = wrapText(ctx, st.title || '', tw);
      if (paint) { ctx.fillStyle = '#15181d'; tl.forEach(function (ln) { ctx.fillText(ln, tx, y + 20); }); }
      y += tl.length * 36;

      if (st.detail) {
        setFont(ctx, 21, 400);
        var dl = wrapText(ctx, st.detail, tw);
        if (paint) { ctx.fillStyle = '#59616e'; dl.forEach(function (ln) { ctx.fillText(ln, tx, y + 14); }); }
        y += dl.length * 31;
      }

      if (st.place || st.duration) {
        setFont(ctx, 20, 400);
        var meta = [st.place ? '地点：' + st.place : '', st.duration ? '时间：' + st.duration : '']
          .filter(Boolean).join('　');
        var ml = wrapText(ctx, meta, tw);
        if (paint) { ctx.fillStyle = '#868e9c'; ml.forEach(function (ln) { ctx.fillText(ln, tx, y + 12); }); }
        y += ml.length * 30;
      }

      if (st.pitfalls && st.pitfalls.length) {
        setFont(ctx, 20, 400);
        var pt = wrapText(ctx, '注意：' + st.pitfalls.join('；'), tw);
        if (paint) { ctx.fillStyle = '#a8481b'; pt.forEach(function (ln) { ctx.fillText(ln, tx, y + 12); }); }
        y += pt.length * 30;
      }

      y += 30;
    });

    // 底部
    setFont(ctx, 19, 400);
    var footLines = wrapText(ctx,
      '内容更新于 ' + (flow.updatedAt || '') + '　·　请以学校官方通知为准　·　生成时间 ' +
      new Date().toLocaleString('zh-CN'), maxW);
    y += 24;
    if (paint) {
      ctx.fillStyle = '#868e9c';
      footLines.forEach(function (ln) { ctx.fillText(ln, x, y); y += 28; });
      ctx.strokeStyle = '#e2e5eb';
      ctx.beginPath(); ctx.moveTo(x, 22 + headH); ctx.lineTo(W - PAD, 22 + headH); ctx.stroke();
    } else { y += footLines.length * 28; }

    return y + PAD;
  }

  function downloadImage(flow) {
    var probe = document.createElement('canvas').getContext('2d');
    var h = layoutCard(probe, flow, false);

    var canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = Math.max(h, 400);
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textBaseline = 'alphabetic';
    layoutCard(ctx, flow, true);

    var a = document.createElement('a');
    a.download = (SITE.name || 'flow') + '-' + flow.name + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  /* ---------------- 分享：文字版 ---------------- */

  function flowToText(flow) {
    var out = ['【' + flow.name + '】'];
    if (SITE.school) out.push(SITE.school + (SITE.campus ? ' ' + SITE.campus : ''));
    if (flow.status === 'draft') out.push('（信息来源核实中，请以学校通知为准）');
    if (flow.status === 'demo') out.push('（演示样例，非真实流程）');
    out.push('');
    if (flow.audience) out.push('适用对象：' + flow.audience);
    if (flow.summary) out.push(flow.summary);
    out.push('');
    (flow.steps || []).forEach(function (s, i) {
      out.push((i + 1) + '. ' + s.title);
      if (s.detail) out.push('   ' + s.detail);
      if (s.materials && s.materials.length) out.push('   材料：' + s.materials.join('、'));
      if (s.place) out.push('   地点：' + s.place);
      if (s.duration) out.push('   时间：' + s.duration);
      if (s.pitfalls && s.pitfalls.length) out.push('   注意：' + s.pitfalls.join('；'));
      out.push('');
    });
    (flow.notes || []).forEach(function (n) {
      out.push('【' + (n.title || '') + '】');
      (n.lines || []).forEach(function (l) { out.push('  ' + l); });
      out.push('');
    });
    out.push('内容更新：' + (flow.updatedAt || '') + '　请以学校官方通知为准');
    return out.join('\n');
  }

  function copyText(flow, btn) {
    var text = flowToText(flow);
    function done(ok) {
      var old = btn.textContent;
      btn.textContent = ok ? '已复制 ✓' : '复制失败，请手动选择';
      setTimeout(function () { btn.textContent = old; }, 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(true); } catch (e) { done(false); }
      document.body.removeChild(ta);
    }
  }

  /* ---------------- 关于页 ---------------- */

  function feedbackHTML() {
    var fb = SITE.feedback || {};
    var email = String(fb.email || '').trim();
    var tpl = '哪条流程：\n哪一步不对：\n你实际遇到的情况：';

    var out = '<p>如果你发现某条流程与现实不符，或者知道一条应该被收录的流程，欢迎告诉我们。' +
      '我们尤其想知道<b>「照着做会白跑一趟」</b>的地方——这类信息只有真正办过的人知道。</p>';

    if (email) {
      out += '<p>' + esc(fb.label || '纠错邮箱') + '：' +
        '<a href="mailto:' + esc(email) +
        '?subject=' + encodeURIComponent('【纠错】流程名') +
        '&amp;body=' + encodeURIComponent(tpl) + '">' + esc(email) + '</a></p>' +
        '<p class="muted">邮件标题写「纠错 + 流程名」，正文按下面三行写就行：</p>' +
        '<pre class="tpl">' + esc(tpl) + '</pre>';
    } else {
      out += '<p class="muted">纠错渠道正在设置中。</p>';
    }

    if (fb.responseNote) out += '<p class="muted">' + esc(fb.responseNote) + '</p>';
    return out;
  }

  function renderAbout() {
    var verified = FLOWS.filter(function (f) { return f.status === 'verified'; }).length;
    main.innerHTML = '' +
      '<a class="back" href="#/">← 返回流程列表</a>' +
      '<h1>关于与来源</h1>' +
      '<div class="prose">' +

      '<h2>这个网站解决什么问题</h2>' +
      '<p>大学里很多事不是难，是没人把话说全：要带什么材料、去哪个窗口、多久办完、什么情况会被退回来。' +
      '这些信息散在通知文件、班级群和老生的经验里。这个网站把它们整理成可以一步步跟着走的流程图，' +
      '每条流程都标明信息来源和核实时间。</p>' +
      '<p>目前收录范围：' + esc(SITE.scope || '') + '，共 ' + FLOWS.length + ' 条流程，其中 ' + verified + ' 条已完成核实。</p>' +

      '<h2>内容怎么来的</h2>' +
      '<p>这批流程的<b>初稿由人工智能工具辅助检索学校公开信息汇总而成</b>，随后由团队成员逐条向学校官网、办事窗口和办过这件事的同学核实。' +
      '每条流程页面上都标明了当前状态：核实通过的显示「已核实」，还没核实到来源的显示「还没核实完 · 仅供参考」。</p>' +
      '<p>我们把这件事写在这里，是因为校园办事信息错一条，就会有人白跑一趟、甚至错过申请窗口。' +
      '所以我们宁可让一部分条目停留在「还没核实完」，也不把没核实过的内容当成结论告诉你。</p>' +

      '<h2>我们不收集你的任何信息</h2>' +
      '<ul>' +
      '<li>没有账号，没有登录，没有后台数据库。</li>' +
      '<li>没有统计埋点，不接入任何第三方分析、广告或字体服务。</li>' +
      '<li>你在步骤里勾选的「材料已备齐」只存在你自己浏览器的 localStorage 里，不会上传到任何地方，清除浏览器数据即消失。</li>' +
      '<li>页面不请求任何外部域名。</li>' +
      '</ul>' +

      '<h2>免责说明</h2>' +
      '<p>校园办事流程会随时间和政策变化。本站内容最后更新于 ' + esc(SITE.updatedAt || '—') +
      '，仅供参考，不构成任何办理承诺。请以学校官网、学院通知或办事窗口的答复为准。</p>' +

      '<h2>第三方素材与授权</h2>' +
      '<ul>' +
      '<li>字体：只使用系统自带字体，未引入任何外部字体文件。</li>' +
      '<li>图标：使用自制 SVG 图标，无第三方图标库。</li>' +
      '<li>代码依赖：零第三方运行时依赖，未引入任何前端框架或 UI 库。</li>' +
      '<li>后勤服务电话：来自学校发放的《校园生活服务指南》。' +
      '<b>其中涉及个人手机号码的，本站一律不公开</b>——只收录以部门、科室或岗位名义对外公布的服务电话。' +
      '需要联系具体管理人员时，请通过本班生活委员或对应办公室索取。</li>' +
      '</ul>' +

      '<h2>人工智能工具使用情况</h2>' +
      '<p>本项目在以下两个环节使用了人工智能工具：<b>①</b> 检索并汇总学校公开的办事信息，形成流程初稿；<b>②</b> 辅助整理数据结构与编写前端代码。' +
      '选题方向、信息架构、视觉方案、内容核实与用户测试由团队完成。</p>' +
      '<p>所有流程内容都进入了人工核实流程：能核实到来源的标注「已核实」并附出来源，核实不到的保留「还没核实完」状态，' +
      '核实后发现与官方信息冲突的条目直接删除。所有由人工智能生成的代码均经过团队逐条复核与修改。</p>' +
      '<p>按照竞赛要求，本项目的人工智能工具使用情况已在《人工智能工具使用情况说明》中完整披露，过程记录可查。</p>' +

      '<h2>反馈与纠错</h2>' +
      feedbackHTML() +

      '</div>';
  }

  /* ---------------- 路由 ---------------- */

  function route() {
    var hash = location.hash || '#/';
    var m = hash.match(/^#\/f\/(.+)$/);
    if (m) { renderFlow(decodeURIComponent(m[1])); }
    else if (hash.indexOf('#/about') === 0) { renderAbout(); }
    else { renderHome(); }
    window.scrollTo(0, 0);
  }

  function footer() {
    var note = document.getElementById('footer-note');
    if (note) {
      note.textContent = (SITE.name || '') + '　·　' + (SITE.school || '') + ' ' + (SITE.campus || '') +
        '　·　内容更新于 ' + (SITE.updatedAt || '') + '　·　不收集任何个人信息　·　请以学校官方通知为准';
    }
  }

  window.addEventListener('hashchange', route);

  footer();
  route();

  // 离线可用：只在 http(s) 下注册 Service Worker。
  // file:// 打开时自动跳过；离线单文件版由 build-single.mjs 设置 __SINGLE_FILE__ 跳过，
  // 避免在console里留下一个没有意义的 404。
  if (!window.__SINGLE_FILE__ && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 注册失败不影响使用 */ });
    });
  }

  /* 供自动化测试调用的钩子：只暴露纯函数，不改变页面任何行为。
   * 用途见 tools/test-search.mjs —— 检索算法是纯函数，可以在 Node 里直接跑，
   * 这样能一次验证几十个查询并做回归，而不是靠手点浏览器。 */
  window.__APP__ = { search: search, scoreFlow: scoreFlow, normalize: normalize, bigrams: bigrams };

})();
</script>
